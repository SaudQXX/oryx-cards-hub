<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oryx Cards Hub — سعود تركي قطان</title>
  <meta name="description" content="Oryx Cards Hub — Showcase. Connect. Inspire." />
  <link rel="icon" type="image/jpeg" href="assets/Oryx-Cards-Hub.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-void:#080C12;
      --bg-deep:#0D1117;
      --bg-card:#111827;
      --bg-card-hover:#141E2E;
      --gold-primary:#C9A84C;
      --gold-dim:#8A6F32;
      --text-primary:#F0E6D0;
      --text-secondary:#9AA0AD;
      --border-gold:rgba(201,168,76,0.3);
      --border-subtle:rgba(255,255,255,0.05);
      --radius-card:12px;
      --transition:.3s ease;
      --font-display:'Cinzel',serif;
      --font-arabic:'Tajawal',sans-serif;
      --shadow-card:0 4px 24px rgba(0,0,0,0.4);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      background:var(--bg-void);
      color:var(--text-primary);
      font-family:var(--font-arabic);
      min-height:100vh;
      overflow-x:hidden;
    }

    .container{max-width:1100px;margin:auto;padding:0 2rem;position:relative}

    .navbar{
      position:fixed;top:0;left:0;right:0;
      padding:1rem 2rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(8,12,18,0.8);
      border-bottom:1px solid var(--border-gold);
      backdrop-filter:blur(10px);
      z-index:100;
    }

    .nav-logo-text{color:var(--gold-primary);font-family:var(--font-display)}

    .lang-btn{
      border:1px solid var(--border-gold);
      background:transparent;
      color:var(--gold-primary);
      padding:.4rem 1rem;
      border-radius:999px;
      cursor:pointer;
    }

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      padding-top:5rem;
    }

    .hero-name{
      font-family:var(--font-display);
      font-size:3rem;
    }

    .hero-title{color:var(--gold-primary);margin:1rem 0}

    .hero-bio{color:var(--text-secondary);max-width:600px;line-height:1.8}

    .btn-primary{
      background:linear-gradient(135deg,var(--gold-dim),var(--gold-primary));
      color:black;
      padding:.7rem 2rem;
      border:none;
      border-radius:8px;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
      margin-top:1rem;
    }

    .projects-section{padding:5rem 0}

    .section-title{
      text-align:center;
      font-family:var(--font-display);
      font-size:2rem;
      margin-bottom:2rem;
    }

    .cards-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:1rem;
    }

    .project-card{
      background:var(--bg-card);
      border:1px solid var(--border-subtle);
      border-radius:var(--radius-card);
      overflow:hidden;
      cursor:pointer;
      transition:var(--transition);
    }

    .project-card:hover{
      transform:translateY(-6px);
      box-shadow:var(--shadow-card);
      background:var(--bg-card-hover);
    }

    .card-image{width:100%;height:180px;object-fit:cover}

    .card-body{padding:1rem}

    .card-title{font-family:var(--font-display);margin-bottom:.5rem}

    .card-desc{color:var(--text-secondary);font-size:.9rem}
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo-text">ORYX CARDS HUB</div>
    <button class="lang-btn" onclick="toggleLang()">EN</button>
  </nav>

  <section class="hero">
    <div class="container">
      <h1 class="hero-name">سعود تركي قطان</h1>
      <p class="hero-title">ذكاء اصطناعي · تطوير ويب</p>
      <p class="hero-bio" id="heroBio">
        مطوّر تقني مهتم بالابتكار وبناء الأنظمة الذكية.
      </p>
      <a href="#projects" class="btn-primary">استعرض المشاريع</a>
    </div>
  </section>

  <section class="projects-section" id="projects">
    <h2 class="section-title">أعمالي</h2>
    <div class="container">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </section>
<script>
let currentLang = 'ar';

function toggleLang(){
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
}

const projects = [
  {
    id:1,
    name:"Oryx Flow",
    nameAr:"Oryx Flow",
    description:"Gaming platform",
    descriptionAr:"منصة ألعاب",
    image:"assets/Oryx-Flow-Demo.jpeg",
    link:"#"
  }
];

function render(){
  const grid = document.getElementById('cardsGrid');

  grid.innerHTML = projects.map(p => {
    const name = currentLang==='ar'?p.nameAr:p.name;
    const desc = currentLang==='ar'?p.descriptionAr:p.description;

    return `
      <div class="project-card">
        <img class="card-image" src="${p.image}">
        <div class="card-body">
          <div class="card-title">${name}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

render();
</script>

</body>
</html>
